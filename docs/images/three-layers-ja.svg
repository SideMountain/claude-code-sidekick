<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="safety" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="skills" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="thinking" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="16" fill="url(#bg3)"/>

  <!-- Layer 1: Safety (bottom) -->
  <g transform="translate(60, 210)">
    <rect width="680" height="70" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="6" height="70" rx="3" fill="url(#safety)"/>
    <text x="32" y="28" fill="#f87171" font-size="22">🛡️</text>
    <text x="62" y="30" fill="#fca5a5" font-size="14" font-weight="700">Layer 1: 安全ガード</text>
    <text x="62" y="52" fill="#94a3b8" font-size="12">hooks が危険操作を物理ブロック — <tspan fill="#f87171">rm -rf</tspan>、<tspan fill="#f87171">main push</tspan>、<tspan fill="#f87171">.env 上書き</tspan>、<tspan fill="#f87171">本番DB</tspan></text>
    <text x="620" y="44" fill="#475569" font-size="11" text-anchor="end">絶対にバイパスできない</text>
  </g>

  <!-- Layer 2: Skills (middle) -->
  <g transform="translate(60, 125)">
    <rect width="680" height="70" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="6" height="70" rx="3" fill="url(#skills)"/>
    <text x="32" y="28" fill="#60a5fa" font-size="22">🧰</text>
    <text x="62" y="30" fill="#93c5fd" font-size="14" font-weight="700">Layer 2: 18 スキル</text>
    <text x="62" y="52" fill="#94a3b8" font-size="12"><tspan fill="#60a5fa">/review</tspan>（PR前ゲート）· <tspan fill="#60a5fa">/auto-implement</tspan>（寝てる間にPR）· <tspan fill="#60a5fa">/setup</tspan> · <tspan fill="#60a5fa">/close-chat</tspan></text>
    <text x="620" y="44" fill="#475569" font-size="11" text-anchor="end">初日からすぐ使える</text>
  </g>

  <!-- Layer 3: Thinking OS (top, highlighted) -->
  <g transform="translate(60, 40)">
    <rect width="680" height="70" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="6" height="70" rx="3" fill="url(#thinking)"/>
    <text x="32" y="28" fill="#a78bfa" font-size="22">🧠</text>
    <text x="62" y="30" fill="#c4b5fd" font-size="14" font-weight="700">Layer 3: 思考OS</text>
    <text x="62" y="52" fill="#94a3b8" font-size="12">あなたの判断原則を <tspan fill="#a78bfa">thinking.md</tspan> に定義 — feedback が複利で効き、Claude の判断が育つ</text>
    <text x="620" y="44" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="end">使うほど賢くなる</text>
  </g>

  <!-- Bottom label -->
  <text x="400" y="305" text-anchor="middle" fill="#64748b" font-size="11">他のテンプレは Layer 1 止まり。sidekick は3層すべてを提供します。</text>
</svg>
