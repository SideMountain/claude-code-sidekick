<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="safety" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="skills" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="thinking" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="16" fill="url(#bg3)"/>

  <!-- Layer 1: Safety (bottom) -->
  <g transform="translate(60, 210)">
    <rect width="680" height="70" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="6" height="70" rx="3" fill="url(#safety)"/>
    <text x="32" y="28" fill="#f87171" font-size="22">🛡️</text>
    <text x="62" y="30" fill="#fca5a5" font-size="14" font-weight="700">Layer 1: Safety Guards</text>
    <text x="62" y="52" fill="#94a3b8" font-size="12">hooks physically block dangerous ops — <tspan fill="#f87171">rm -rf</tspan>, <tspan fill="#f87171">main push</tspan>, <tspan fill="#f87171">.env overwrite</tspan>, <tspan fill="#f87171">prod DB</tspan></text>
    <text x="600" y="44" fill="#475569" font-size="11" text-anchor="end">can't bypass, ever</text>
  </g>

  <!-- Layer 2: Skills (middle) -->
  <g transform="translate(60, 125)">
    <rect width="680" height="70" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="6" height="70" rx="3" fill="url(#skills)"/>
    <text x="32" y="28" fill="#60a5fa" font-size="22">🧰</text>
    <text x="62" y="30" fill="#93c5fd" font-size="14" font-weight="700">Layer 2: 13 Skills</text>
    <text x="62" y="52" fill="#94a3b8" font-size="12"><tspan fill="#60a5fa">/review</tspan> (pre-PR gate)  ·  <tspan fill="#60a5fa">/auto-implement</tspan> (Issues → PRs overnight)  ·  <tspan fill="#60a5fa">/setup</tspan>  ·  <tspan fill="#60a5fa">/close-chat</tspan></text>
    <text x="600" y="44" fill="#475569" font-size="11" text-anchor="end">ready to use, day one</text>
  </g>

  <!-- Layer 3: Thinking OS (top, highlighted) -->
  <g transform="translate(60, 40)">
    <rect width="680" height="70" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="6" height="70" rx="3" fill="url(#thinking)"/>
    <text x="32" y="28" fill="#a78bfa" font-size="22">🧠</text>
    <text x="62" y="30" fill="#c4b5fd" font-size="14" font-weight="700">Layer 3: Thinking OS</text>
    <text x="62" y="52" fill="#94a3b8" font-size="12">your decision principles in <tspan fill="#a78bfa">thinking.md</tspan> — feedback compounds into judgment Claude follows</text>
    <text x="600" y="44" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="end">grows every session</text>
  </g>

  <!-- Bottom label -->
  <text x="400" y="305" text-anchor="middle" fill="#64748b" font-size="11">Other templates stop at Layer 1. sidekick gives you all three.</text>
</svg>
