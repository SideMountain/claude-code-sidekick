<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">知識が複利で効く — 学習ループ</text>
  <text x="400" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">使うたびに Claude があなたの考え方を学ぶ</text>

  <!-- Timeline: Week 1 -->
  <g transform="translate(60, 100)">
    <rect width="160" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="160" height="32" rx="12" fill="url(#amber)"/>
    <rect y="20" width="160" height="12" fill="url(#amber)"/>
    <text x="80" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Week 1</text>
    <text x="80" y="58" text-anchor="middle" fill="#e2e8f0" font-size="11">あなたの指摘:</text>
    <text x="80" y="76" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">「DB モックを使うな」</text>
    <text x="80" y="98" text-anchor="middle" fill="#64748b" font-size="10">→ feedback に記録</text>
  </g>

  <!-- Timeline: Week 4 -->
  <g transform="translate(250, 100)">
    <rect width="160" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="160" height="32" rx="12" fill="url(#accent)"/>
    <rect y="20" width="160" height="12" fill="url(#accent)"/>
    <text x="80" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Week 4</text>
    <text x="80" y="58" text-anchor="middle" fill="#e2e8f0" font-size="11">パターン検出:</text>
    <text x="80" y="76" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">同じ指摘が3回目</text>
    <text x="80" y="98" text-anchor="middle" fill="#64748b" font-size="10">→ 原則に昇格</text>
  </g>

  <!-- Timeline: Week 8 -->
  <g transform="translate(440, 100)">
    <rect width="160" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="160" height="32" rx="12" fill="url(#green)"/>
    <rect y="20" width="160" height="12" fill="url(#green)"/>
    <text x="80" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Week 8</text>
    <text x="80" y="58" text-anchor="middle" fill="#e2e8f0" font-size="11">Claude から提案:</text>
    <text x="80" y="76" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">「ステージング DB で</text>
    <text x="80" y="92" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">実行します」</text>
  </g>

  <!-- Result -->
  <g transform="translate(630, 100)">
    <rect width="130" height="110" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="65" y="45" text-anchor="middle" fill="#10b981" font-size="28">✓</text>
    <text x="65" y="70" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">同じ指摘を</text>
    <text x="65" y="86" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">繰り返す疲れ</text>
    <text x="65" y="102" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">がなくなる</text>
  </g>

  <!-- Arrows between timeline -->
  <line x1="222" y1="155" x2="248" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="412" y1="155" x2="438" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602" y1="155" x2="628" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cycle diagram below -->
  <g transform="translate(100, 260)">
    <!-- feedback -->
    <rect x="0" y="20" width="120" height="50" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="42" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">feedback_*.md</text>
    <text x="60" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">セッション中の修正</text>

    <!-- /weekly-review -->
    <rect x="170" y="20" width="130" height="50" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="235" y="42" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">/weekly-review</text>
    <text x="235" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">パターン検出</text>

    <!-- You approve -->
    <rect x="350" y="20" width="100" height="50" rx="10" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="400" y="42" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">あなたが承認</text>
    <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">人間が最終判断</text>

    <!-- thinking.md -->
    <rect x="500" y="20" width="120" height="50" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="560" y="42" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">thinking.md</text>
    <text x="560" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">あなたの判断原則</text>

    <!-- Arrows -->
    <line x1="122" y1="45" x2="168" y2="45" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="302" y1="45" x2="348" y2="45" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="452" y1="45" x2="498" y2="45" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Return arrow (loop) -->
    <path d="M560,72 L560,100 Q560,110 550,110 L70,110 Q60,110 60,100 L60,72"
          fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-accent)"/>
    <text x="310" y="125" text-anchor="middle" fill="#8b5cf6" font-size="10">Claude が適用 → 新しい気づき → サイクルが回り続ける</text>
  </g>

  <!-- Bottom tagline -->
  <text x="400" y="405" text-anchor="middle" fill="#64748b" font-size="11">静的なルールは「何をするか」を教える。思考OS は「どう考えるか」を教える。</text>
</svg>
