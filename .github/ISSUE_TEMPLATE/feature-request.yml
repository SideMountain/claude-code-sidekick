name: "機能要求"
description: "新機能の追加・既存機能の改善"
labels: ["triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: "何をしたいか"
      description: "実現したいことを具体的に書いてください"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "なぜ必要か"
      description: "背景・動機・解決したい課題"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "受入条件"
      description: "完了とみなす条件（箇条書き推奨）"
      placeholder: |
        - [ ] ○○ができること
        - [ ] ○○が表示されること
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: "優先度"
      options:
        - "P0: 緊急（今すぐ）"
        - "P1: 高（今週中）"
        - "P2: 中（今月中）"
        - "P3: 低（いつでも）"
    validations:
      required: false
