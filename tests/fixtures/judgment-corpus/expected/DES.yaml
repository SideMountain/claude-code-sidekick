# 凍結判定: 2026-07-05 / claude-fable-5（Mythos-class）
# 変更禁止（append-only）。被測定モデルには絶対に見せない。
# holdout: true のケースは REVIEW.md / rubrics の few-shot exemplar に使用禁止（README「held-out 分割」参照）。

- id: DES-01
  decision: "B"
  holdout: false
  must_find:
    - "permissions は下流が拡張する資産であり、全文上書き（A）は下流の調整を破壊する（安全側に倒す違反）"
    - "配布対象外のまま（C）だと hook 本体だけ届いて発火しない silent no-op が続き、手動追従手順は仕組み化のサインの放置（配布物の完全自己完結に未達）"
    - "テンプレ側が管理するキー（hooks）と下流が管理するキー（permissions）の責務分界に沿った partial merge が両立解。失敗時原本不変（fail-safe）まで含めて設計"
  rationale: |
    所有権がキー単位で分かれているファイルは、キー単位に merge 境界を引くのが
    唯一の両立解。A は下流資産の clobber、C は silent 未配線の恒久化 +
    「手動で○○して」を書きたくなったら仕組み化のサイン（brain §1）に反する。

- id: DES-02
  decision: "B"
  holdout: false
  must_find:
    - "行頭アンカー維持 + 個別パターン追加（A）は変形（env 前置・wrapper・サブシェル）を列挙し切れない いたちごっこで、修正漏れを構造で防ぐ原則に反する"
    - "quote 除去なしの部分一致（C）は、引用として言及しただけのコマンドを false-deny する"
    - "同リポの push ガードに実証済みの同型構造があり、既存活用ファースト + ガード間の一貫性で B"
  rationale: |
    検知の網羅性（バイパス耐性）と誤爆回避を同時に満たすのは
    「quote 除去 → セグメント分割 → 単語境界」の構造のみ。
    実証済みの既存構造への統一は保守・レビュー可能性でも優る。

- id: DES-03
  decision: "B"
  holdout: false
  must_find:
    - "誤 pass が実害になるのは現実性の低い異常系のみで、fence 追跡ステートマシン（A）は検査自体の複雑化・バグ持ち込みリスクに見合わない（簡潔さ・70% で動く・過剰機械化）"
    - "限界を受容する場合はコメントに明記する（silent drop 禁止・既知の限界の可視化）"
    - "検査の削除（C）は決定的ゲートを目視裁量へ戻す退行（機械で分かることは LLM/人に判定させない）"
  rationale: |
    決定的検査の価値は主要な失敗モードを機械で塞ぐことにあり、全ケース網羅
    ではない。低現実性ケースへの防御追加は過剰複雑化（シニアエンジニア proxy
    テストで落ちる）。受容 + 明記（B）が検知層の設計として正しい。

- id: DES-04
  decision: "B"
  holdout: true
  must_find:
    - "インライン（A）は SKILL.md 200 行ガイドに反する上、コードブロックはファイルとして実行・機械検証（bash -n・実走）できず、コピペ実行はドリフトする"
    - "利用者が 1 スキルだけの段階で共有層 + 汎用インターフェース（C）は YAGNI（1 箇所でしか使わないコードに汎用的な抽象化を作らない）"
    - "スキル配下 scripts/ への分離は遅延ロード（呼び出し時のみ）で文脈経済とも整合。共有が 2 例目で発生した時点で共有層へ昇格するのが正順"
  rationale: |
    A は検証不能 + 常駐肥大、C は時期尚早の一般化。スキル専用の決定的検査は
    スキル配下 scripts/ に置くのが、検証可能性・文脈経済・YAGNI の全てを満たす。
