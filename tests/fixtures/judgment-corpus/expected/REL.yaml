  rationale: |
    R10-1「ガード/hook の迂回可能性の修正」に該当（バイパス 6 件修正）。
    下流 PJ は取り込まない限り迂回可能なガードで走り続けるため、
    最優先で取り込ませる Critical。Stop hook 配線が新規追加でも min ではなく
