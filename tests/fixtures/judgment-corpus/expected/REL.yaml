    「既存挙動の変更ゼロ」を要求する Enhancement には該当しない。
    内容削除がなくても配置変更は挙動変更。よって Standard。

- id: REL-03
  severity: "Enhancement"
  rationale: |
    新規追加のみ・opt-in・既定 PJ に無影響・既存ファイル変更ゼロで
