# 凍結判定: 2026-07-05 / claude-fable-5（Mythos-class）
# 変更禁止（append-only）。被測定モデルには絶対に見せない。
# holdout: true のケースは REVIEW.md / rubrics の few-shot exemplar に使用禁止（README「held-out 分割」参照）。

- id: CON-01
  resolution: "R2"
  holdout: false
  must_find:
    - "二律背反に見えるのは『検知対象 = 生文字列』という前提のせいで、quote/heredoc 除去という前処理が『実行される git commit』と『引用された git commit』を構造的に区別する"
    - "R1 は強制層の既知の穴の放置（検査素通りの継続）で、検知を広げる方向のみの規範に反する"
    - "R3 は false-deny の常態化でガードの信頼を毀損する（誤爆が続くガードは無視・迂回されるようになる）"
  rationale: |
    2 つの規範はレイヤーが違う要求（検知の網羅性 / 判定対象の正確性）であり、
    前処理を挟めば両方満たせる。「どちらを捨てるか」で裁定を始めた時点で誤り。
    第三の道の存在検査ができているかを測る。

- id: CON-02
  resolution: "R2"
  holdout: true
  must_find:
    - "severity 定義の単一ソースは REVIEW.md §2 であり、scoring-guide の『WARN 2 件まで pass』は定義への例外を集計側に持ち込んだ drift（定義の責務と集計の責務の混同）"
    - "安全機構に関わる判定は文書矛盾時に安全側（厳しい側）へ倒す"
    - "矛盾の放置（R3）は同じ誤判定の再発を許す — 文書を単一ソースへ再収束させる是正までがこの裁定の範囲（構造で防ぐ）"
  rationale: |
    「何が BLOCKER か」は定義文書の責務、「複数観点をどう畳むか」は集計文書の
    責務。定義に反する例外が集計側に生えたなら直すのは集計側。当該 diff の
    fail 判定 + 文書是正の両方を含む R2 が正。R1 は責務の取り違え。

- id: CON-03
  resolution: "R2"
  holdout: false
  must_find:
    - "配布昇格（R1）は『設計経緯を下流に背負わせない』という配布境界の決定を、スキル都合で破る（上位決定の優先）"
    - "下流 skip（R3）は下流だけ ADR 品質ガイドが消える機能差で、配布物の完全自己完結（下流が上流の事情を肩代わりしない・機能は等価に届く）に反する"
    - "アンカーの目的は『良質な exemplar が存在すること』であって特定文書ではない → 参照のパラメタ化（実行環境の自リポの直近良質 ADR）で決定とガイドが両立"
  rationale: |
    固定名参照を環境非依存の相対参照に置き換えれば、非配布の決定を守ったまま
    下流でも同じ品質ガイドが機能する。目的（exemplar の存在）と手段（特定
    ADR 名）を分離できるかを測る。
