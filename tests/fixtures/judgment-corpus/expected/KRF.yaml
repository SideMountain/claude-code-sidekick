# 凍結判定: 2026-07-04 / claude-fable-5（Mythos-class）
# 変更禁止（append-only）。被測定モデルには絶対に見せない。

- id: KRF-01
  classification: "personal-brain"
  rationale: |
    R7 は上から順に判定する。R7-1 OSS: PJ 名なしで書ける（YES）が、
    「業界の誰が読んでも行動が変わる」は WSL + vitest 利用者に限られ NO。
    R7-2: 特定 PJ に依存せず複数 PJ 横断で適用する環境ノウハウ → YES。
    環境条件付きの知見は「誰でも」に達しない。迷ったら下位の原則とも整合。

- id: KRF-02
  promote: "YES"
  rationale: |
    R6 致命クラスの閉集合 {データ喪失, 本番影響, セキュリティ/ガード無効化,
    不可逆 git 事故} のうち「不可逆 git 事故」に該当（未遂でも失敗モードは同一）。
    致命クラスは N=1 で即昇格候補にしてよく、3 件ルールを適用しない。

- id: KRF-03
  same_gist: "YES"
  criteria: "R5-1 NO（commit と PR 作成でトリガ操作が異なる）/ R5-2 YES（是正はどちらも『成果物確定前に実 diff と突合する』）/ R5-3 YES（失敗モードはどちらも『宣言・意図と実変更の乖離』）"
  rationale: |
    2/3 YES で同趣旨。表面の操作が違っても、是正行動と失敗モードが一致する
    ペアを束ねられるかを見るケース。トリガの字面差で NO にするのが典型的な誤答。
